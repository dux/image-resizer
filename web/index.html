<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Resizer</title>
  <link rel="icon" href="/favicon.ico" type="image/svg+xml">
  <script>
    // pick the theme before the first paint
    try {
      const choice = JSON.parse(localStorage.getItem('theme') || '"system"')
      const dark = choice === 'dark' || (choice !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
      document.documentElement.classList.toggle('dark', dark)
    } catch {}
  </script>
  <script src="/web/lib/icons.js"></script>
  <script src="/web/lib/format.js"></script>
  <script src="https://dux.github.io/fez/dist/fez.min.js"></script>
  <script fez="/web/components/ui/ui-theme.fez"></script>
  <script fez="/web/components/ui/ui-icon.fez"></script>
  <script fez="/web/components/ui/ui-toast.fez"></script>
  <script fez="/web/components/ui/ui-dialog.fez"></script>
  <script fez="/web/components/app/app-shell.fez"></script>
  <script fez="/web/components/app/api-explorer.fez"></script>
  <script fez="/web/components/demo/img-preview.fez"></script>
  <script fez="/web/components/tpl/tpl-home.fez"></script>
  <script fez="/web/components/tpl/tpl-demo.fez"></script>
  <script fez="/web/components/tpl/tpl-config.fez"></script>
  <script fez="/web/components/tpl/tpl-cache.fez"></script>
  <script fez="/web/components/tpl/tpl-logs.fez"></script>
  <script fez="/web/components/tpl/tpl-keys.fez"></script>
</head>
<body>
  <div class="pjax" id="app">
    <app-shell></app-shell>
  </div>
</body>
</html>
